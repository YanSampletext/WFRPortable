# Собирает APK и выкладывает его в релиз при пуше тега вида v1.2.3.
#
# Собирается приложение Capacitor: весь сайт зашит внутрь APK.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — wfrp4.keystore в base64:
#                              [Convert]::ToBase64String([IO.File]::ReadAllBytes("wfrp4.keystore"))
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS        — у нашего ключа это android
#   ANDROID_KEY_PASSWORD
#
# Без секретов сборка не падает, но APK получается неподписанным:
# поставить его поверх установленного приложения не выйдет.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза, к которому приложить APK (пусто — только артефакт запуска)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # секреты нельзя проверять прямо в if у шага — заводим флаг на уровне job
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 требует Node >= 22
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # Статический аудит: потерянные обработчики, мёртвые объявления,
      # неиспользуемые селекторы, целостность комментариев в CSS и совпадение
      # подключённого в странице со списком в service worker. Браузера не
      # требует и идёт секунду, поэтому стоит первым: незачем ставить Chromium
      # и собирать APK из заведомо сломанного кода.
      - name: Audit sources
        run: node scripts/audit.mjs

      # Chromium весит под сотню мегабайт, поэтому кешируем по версии
      # Playwright из package-lock: пока она не менялась, скачивания нет.
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Прогон по живым функциям всех модулей и обход каждого экрана. Сервер
      # скрипты поднимают сами, так что запускать рядом нечего.
      - name: Run checks
        run: |
          node scripts/check-features.mjs
          node scripts/check-app.mjs

      - name: Build web bundle and sync Android project
        run: npm run sync

      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Name the artifact
        id: apk
        env:
          # при ручном запуске GITHUB_REF_NAME — это «main», а не версия
          VERSION: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          SUFFIX=""
          if [ "$HAS_SIGNING_KEY" != "true" ]; then SUFFIX="-unsigned"; fi
          DEST="dosye-ordo-${VERSION}${SUFFIX}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Собрано: $DEST ($(du -h "$DEST" | cut -f1))"

      # Что уцелело после сжатия R8: мост WebView, плагины, ярлыки, сайт внутри
      - name: Check the built APK
        run: node scripts/check-apk.mjs "${{ steps.apk.outputs.path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}

      # Неподписанный APK Android установить не даст вообще, поэтому в релиз
      # он не попадает — только в артефакты запуска, для проверки сборки
      - name: Publish release
        if: env.HAS_SIGNING_KEY == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" "$APK" \
            --title "Досье Ордо $TAG" \
            --notes "Самодостаточное приложение: весь сайт внутри APK, без адресной строки и без интернета. Android 11 и новее." \
          || gh release upload "$TAG" "$APK" --clobber
