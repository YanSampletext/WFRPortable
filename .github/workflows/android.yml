# Собирает APK и выкладывает его в релиз при пуше тега вида v1.2.3.
#
# Прошлая CI-сборка была на Bubblewrap и делала TWA — оболочку над сайтом,
# которой для работы нужны и Pages, и assetlinks. Здесь собирается
# самодостаточное приложение Capacitor: весь сайт внутри APK.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — twa-project/android.keystore в base64:
#                              base64 -w0 android.keystore                     (Linux)
#                              [Convert]::ToBase64String([IO.File]::ReadAllBytes("android.keystore"))  (PowerShell)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS        — у нашего ключа это android
#   ANDROID_KEY_PASSWORD
#
# Без секретов сборка не падает, но APK получается неподписанным:
# поставить его поверх установленного приложения не выйдет.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза, к которому приложить APK (пусто — только артефакт запуска)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # секреты нельзя проверять прямо в if у шага — заводим флаг на уровне job
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 требует Node >= 22
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Android project
        run: npm run sync

      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Name the artifact
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          SUFFIX=""
          if [ "$HAS_SIGNING_KEY" != "true" ]; then SUFFIX="-unsigned"; fi
          DEST="wfrp4-dossier-${GITHUB_REF_NAME}${SUFFIX}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Собрано: $DEST ($(du -h "$DEST" | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}

      # Неподписанный APK Android установить не даст вообще, поэтому в релиз
      # он не попадает — только в артефакты запуска, для проверки сборки
      - name: Publish release
        if: env.HAS_SIGNING_KEY == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" "$APK" \
            --title "WFRP 4 — Досье Ордо $TAG" \
            --notes "Самодостаточное приложение: весь сайт внутри APK, без адресной строки и без интернета. Android 11 и новее." \
          || gh release upload "$TAG" "$APK" --clobber
